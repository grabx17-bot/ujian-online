<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ujian Online Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- App Container -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Dynamic Content injected via JS -->
    </div>

    <script>
        const app = document.getElementById('app');

        // --- VIEWS ---

        function renderParticipantLogin() {
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                        <div class="text-center mb-8">
                            <h1 class="text-2xl font-bold text-slate-900">Ujian Online</h1>
                            <p class="text-slate-500 text-sm mt-1">Masukkan Login Code yang diberikan oleh administrator.</p>
                        </div>
                        <form id="loginForm" onsubmit="handleParticipantLogin(event)">
                            <div class="mb-4">
                                <label class="block text-sm font-semibold mb-2 text-slate-700">Login Code Anda</label>
                                <input type="text" id="loginCode" required placeholder="Contoh: K7X9-P2LM" 
                                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none uppercase tracking-wider text-center font-mono text-lg">
                            </div>
                            <div id="loginError" class="mb-4 text-rose-500 text-sm text-center font-medium hidden"></div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-100">
                                MASUK UJIAN
                            </button>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#" onclick="renderAdminLogin()" class="text-xs text-slate-400 hover:text-indigo-600">Login Administrator</a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleParticipantLogin(e) {
            e.preventDefault();
            const code = document.getElementById('loginCode').value;
            const errorEl = document.getElementById('loginError');
            
            try {
                const res = await fetch('/api/participant/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (res.ok) {
                    startExamSession();
                } else {
                    errorEl.textContent = data.error;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Terjadi kesalahan jaringan.';
                errorEl.classList.remove('hidden');
            }
        }

        async function startExamSession() {
            const res = await fetch('/api/participant/exam-data');
            const data = await res.json();
            if (!res.ok) return alert('Gagal memuat ujian.');

            window.examData = data.questions;
            window.examSettings = data.settings;
            window.userAnswers = {};
            window.currentQuestionIndex = 0;

            // Timer setup per block
            window.timeRemaining = window.examSettings.time_per_block;
            
            renderExamScreen();
            startTimer();
        }

        function renderExamScreen() {
            const questions = window.examData;
            const q = questions[window.currentQuestionIndex];
            const total = questions.length;

            app.innerHTML = `
                <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                    <h2 class="font-bold text-slate-700">Sesi Ujian Online</h2>
                    <div id="timerDisplay" class="bg-indigo-50 text-indigo-700 font-mono px-4 py-2 rounded-lg font-bold border border-indigo-100">
                        Waktu tersisa: 00:00
                    </div>
                </header>
                <main class="flex-1 max-w-3xl w-full mx-auto p-6 flex flex-col justify-center">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                        <div class="flex justify-between items-center mb-6 text-sm text-slate-400 font-medium">
                            <span>Soal ${window.currentQuestionIndex + 1} dari ${total}</span>
                        </div>
                        <h3 class="text-xl font-semibold text-slate-900 mb-6">${q.question}</h3>
                        <div class="space-y-3 mb-8">
                            ${q.options.map((opt, idx) => {
                                const optLetter = ['A', 'B', 'C', 'D'][idx];
                                const isSelected = window.userAnswers[q.id] === opt;
                                return `
                                    <label class="flex items-center p-4 border rounded-xl cursor-pointer transition ${isSelected ? 'border-indigo-600 bg-indigo-50/50 text-indigo-900 font-medium' : 'border-slate-200 hover:bg-slate-50'}">
                                        <input type="radio" name="question_${q.id}" value="${opt}" ${isSelected ? 'checked' : ''} onchange="saveAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')" class="mr-4 text-indigo-600 focus:ring-indigo-500">
                                        <span><strong class="mr-2">${optLetter}.</strong>${opt}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                            <button onclick="prevQuestion()" ${window.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 border border-slate-300 rounded-xl font-medium text-slate-600 disabled:opacity-50">Sebelumnya</button>
                            <div class="flex gap-1 overflow-x-auto max-w-xs">
                                ${questions.map((item, idx) => `
                                    <button onclick="goToQuestion(${idx})" class="w-8 h-8 rounded-lg text-xs font-bold ${idx === window.currentQuestionIndex ? 'bg-indigo-600 text-white' : (window.userAnswers[item.id] ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600')}">
                                        ${idx + 1}
                                    </button>
                                `).join('')}
                            </div>
                            ${window.currentQuestionIndex === total - 1 ? 
                                `<button onclick="submitExam()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md">Selesaikan Ujian</button>` :
                                `<button onclick="nextQuestion()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl">Berikutnya</button>`
                            }
                        </div>
                    </div>
                </main>
            `;
            updateTimerDisplay();
        }

        function saveAnswer(questionId, answer) {
            window.userAnswers[questionId] = answer;
            renderExamScreen();
        }

        function nextQuestion() {
            if (window.currentQuestionIndex < window.examData.length - 1) {
                window.currentQuestionIndex++;
                renderExamScreen();
            }
        }

        function prevQuestion() {
            if (window.currentQuestionIndex > 0) {
                window.currentQuestionIndex--;
                renderExamScreen();
            }
        }

        function goToQuestion(index) {
            window.currentQuestionIndex = index;
            renderExamScreen();
        }

        function startTimer() {
            if (window.timerInterval) clearInterval(window.timerInterval);
            window.timerInterval = setInterval(() => {
                window.timeRemaining--;
                updateTimerDisplay();
                if (window.timeRemaining <= 0) {
                    clearInterval(window.timerInterval);
                    alert('Waktu untuk sesi ini habis! Ujian akan disubmit otomatis.');
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            if (!el) return;
            const mins = Math.floor(window.timeRemaining / 60);
            const secs = window.timeRemaining % 60;
            el.textContent = `Waktu tersisa: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (window.timeRemaining <= 10) {
                el.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
            }
        }

        async function submitExam() {
            if (window.timerInterval) clearInterval(window.timerInterval);
            const answersArray = Object.keys(window.userAnswers).map(qId => ({
                questionId: parseInt(qId),
                selectedAnswer: window.userAnswers[qId]
            }));

            try {
                const res = await fetch('/api/participant/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: answersArray })
                });
                const result = await res.json();
                if (res.ok) {
                    renderResultScreen(result);
                } else {
                    alert('Gagal mengirim ujian.');
                }
            } catch (err) {
                alert('Kesalahan jaringan.');
            }
        }

        function renderResultScreen(result) {
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-6">
                    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
                        <h2 class="text-2xl font-bold text-slate-900 mb-2">Hasil Ujian</h2>
                        <p class="text-slate-500 mb-6">Ujian telah selesai disubmit dan dievaluasi.</p>
                        
                        <div class="inline-block px-4 py-2 rounded-xl text-lg font-bold mb-6 ${result.passed ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
                            Status: ${result.passed ? 'LULUS' : 'TIDAK LULUS'}
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs text-slate-400 block">Total Nilai</span>
                                <span class="text-2xl font-bold text-slate-800">${result.score.toFixed(1)}%</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs text-slate-400 block">Jawaban Benar</span>
                                <span class="text-2xl font-bold text-emerald-600">${result.correctCount}</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs text-slate-400 block">Jawaban Salah</span>
                                <span class="text-2xl font-bold text-rose-600">${result.wrongCount}</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <span class="text-xs text-slate-400 block">Tidak Dijawab</span>
                                <span class="text-2xl font-bold text-slate-600">${result.unansweredCount}</span>
                            </div>
                        </div>

                        <div class="w-48 h-48 mx-auto mb-6">
                            <canvas id="resultChart"></canvas>
                        </div>

                        <button onclick="renderParticipantLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                            Selesai & Keluar
                        </button>
                    </div>
                </div>
            `;

            const ctx = document.getElementById('resultChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Benar', 'Salah', 'Kosong'],
                    datasets: [{
                        data: [result.correctCount, result.wrongCount, result.unansweredCount],
                        backgroundColor: ['#10B981', '#F43F5E', '#94A3B8']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- ADMIN VIEWS ---

        function renderAdminLogin() {
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                        <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Login Administrator</h2>
                        <form onsubmit="handleAdminLogin(event)">
                            <div class="mb-4">
                                <label class="block text-sm font-semibold mb-2 text-slate-700">Username</label>
                                <input type="text" id="adminUser" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-semibold mb-2 text-slate-700">Password</label>
                                <input type="password" id="adminPass" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition">
                                MASUK DASHBOARD
                            </button>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#" onclick="renderParticipantLogin()" class="text-xs text-indigo-600 hover:underline">Kembali ke Login Peserta</a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (res.ok) {
                renderAdminDashboard('codes');
            } else {
                alert('Login gagal. Periksa username/password.');
            }
        }

        async function renderAdminDashboard(tab = 'codes') {
            app.innerHTML = `
                <div class="flex h-screen bg-slate-100">
                    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
                        <div class="p-6 font-bold text-white text-lg border-b border-slate-800">Admin Dashboard</div>
                        <nav class="flex-1 p-4 space-y-2">
                            <button onclick="renderAdminDashboard('codes')" class="w-full text-left px-4 py-2.5 rounded-xl font-medium ${tab === 'codes' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">Login Codes</button>
                            <button onclick="renderAdminDashboard('import')" class="w-full text-left px-4 py-2.5 rounded-xl font-medium ${tab === 'import' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">Import Excel Soal</button>
                            <button onclick="renderAdminDashboard('results')" class="w-full text-left px-4 py-2.5 rounded-xl font-medium ${tab === 'results' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">Hasil Peserta</button>
                            <button onclick="renderParticipantLogin()" class="w-full text-left px-4 py-2.5 rounded-xl text-rose-400 hover:bg-slate-800 mt-8">Keluar</button>
                        </nav>
                    </aside>
                    <main class="flex-1 p-8 overflow-y-auto" id="adminContent">
                        <!-- Content loaded dynamically -->
                    </main>
                </div>
            `;

            const container = document.getElementById('adminContent');
            if (tab === 'codes') {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-slate-800">Manajemen Login Code</h2>
                        <button onclick="generateCodes()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-semibold shadow">Generate 5 Kode Baru</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <th class="p-4">Kode</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4">Dibuat</th>
                                    <th class="p-4">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="codesTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                `;
                loadCodesTable();
            } else if (tab === 'import') {
                container.innerHTML = `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Import Soal dari Excel</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-xl">
                        <form onsubmit="handleExcelImport(event)">
                            <div class="mb-4">
                                <label class="block text-sm font-semibold mb-2 text-slate-700">Pilih File Excel (.xlsx)</label>
                                <input type="file" id="excelFile" accept=".xlsx" required class="w-full border border-slate-300 rounded-xl p-2">
                                <p class="text-xs text-slate-400 mt-2">Kolom A: Pertanyaan | Kolom B: Jawaban Benar (Sistem otomatis membuat 3 distractor).</p>
                            </div>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl">Import Soal</button>
                        </form>
                    </div>
                `;
            } else if (tab === 'results') {
                container.innerHTML = `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Hasil Ujian Peserta</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <th class="p-4">Login Code</th>
                                    <th class="p-4">Benar</th>
                                    <th class="p-4">Salah</th>
                                    <th class="p-4">Nilai</th>
                                    <th class="p-4">Status</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                `;
                loadResultsTable();
            }
        }

        async function loadCodesTable() {
            const res = await fetch('/api/admin/codes');
            const codes = await res.json();
            const tbody = document.getElementById('codesTableBody');
            tbody.innerHTML = codes.map(c => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold">${c.code}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${c.status === 'Active' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">${c.status}</span></td>
                    <td class="p-4 text-slate-500">${c.created_at}</td>
                    <td class="p-4"><button onclick="deleteCode(${c.id})" class="text-rose-500 hover:underline">Hapus</button></td>
                </tr>
            `).join('');
        }

        async function generateCodes() {
            await fetch('/api/admin/codes/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: 5 })
            });
            loadCodesTable();
        }

        async function deleteCode(id) {
            await fetch(`/api/admin/codes/${id}`, { method: 'DELETE' });
            loadCodesTable();
        }

        async function handleExcelImport(e) {
            e.preventDefault();
            const fileInput = document.getElementById('excelFile');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/admin/questions/import', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                alert(`Berhasil mengimport ${data.importedCount} soal!`);
                fileInput.value = '';
            } else {
                alert('Gagal import: ' + data.error);
            }
        }

        async function loadResultsTable() {
            const res = await fetch('/api/admin/results');
            const results = await res.json();
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = results.map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold">${r.code}</td>
                    <td class="p-4">${r.correct_count}</td>
                    <td class="p-4">${r.wrong_count}</td>
                    <td class="p-4 font-semibold">${r.score.toFixed(1)}%</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${r.passed ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${r.passed ? 'LULUS' : 'TIDAK LULUS'}</span></td>
                </tr>
            `).join('');
        }

        // Initialize App to Participant Login by Default
        renderParticipantLogin();
    </script>
</body>
</html>
